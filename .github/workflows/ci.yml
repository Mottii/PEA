name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-packaging:
    name: Lint, MCPB Audit & Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create venv and install dev dependencies
        run: |
          uv venv --clear .venv --python 3.13
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Run ruff linter
        run: .venv/bin/ruff check src/ tests/ scripts/

      - name: Audit Claude Desktop .mcpb packaging
        run: |
          .venv/bin/python scripts/build_mcpb.py --check
          node --check packaging/mcpb/launcher.mjs

      - name: Check tracked files for forbidden paths, binaries & secrets
        run: |
          .venv/bin/python - <<'PY'
          import re, subprocess, sys
          from pathlib import Path

          tracked = [
              line.strip()
              for line in subprocess.check_output(["git", "ls-files"], text=True).splitlines()
              if line.strip()
          ]
          forbidden_exts = (".swf", ".pdf", ".docx", ".zip", ".onnx", ".wasm", ".mcpb")
          forbidden_prefixes = (
              ".venv/",
              "local_assets/",
              "runs/",
              "dist/",
              "profiles/local/",
              "magnetic-field-lab/",
              "lab-runner/",
              "field-lab-mcp/",
              "swf-pilot/",
          )
          patterns = [
              ("macOS home path", re.compile("/" + r"Users/[A-Za-z0-9._-]+")),
              ("Linux home path", re.compile("/" + r"home/[A-Za-z0-9._-]+")),
              ("Windows home path", re.compile(r"[A-Za-z]:\\" + r"Users\\[A-Za-z0-9._-]+")),
              ("Anthropic API key", re.compile(r"\b" + "sk-ant-" + r"api[0-9]{2}-[A-Za-z0-9_-]{16,}\b")),
              ("OpenAI project key", re.compile(r"\b" + "sk-" + r"proj-[A-Za-z0-9_-]{16,}\b")),
              ("Google API key", re.compile(r"\b" + "AI" + r"za[0-9A-Za-z_-]{20,}\b")),
              ("GitHub token", re.compile(r"\b" + "gh" + r"[pousr]_[A-Za-z0-9]{20,}\b")),
              ("AWS access key ID", re.compile(r"\b" + "AK" + r"IA[0-9A-Z]{16}\b")),
              ("private key PEM block", re.compile("-----BEGIN " + r"[A-Z0-9 ]*PRIVATE KEY-----")),
          ]
          errors = []
          for rel in tracked:
              if rel.lower().endswith(forbidden_exts):
                  errors.append(f"Forbidden binary tracked: {rel}")
              if rel.startswith(forbidden_prefixes):
                  errors.append(f"Forbidden directory tracked: {rel}")
              text = Path(rel).read_text(encoding="utf-8", errors="ignore")
              for label, pat in patterns:
                  if pat.search(text):
                      errors.append(f"Forbidden {label} in tracked file: {rel}")
          if errors:
              for err in errors:
                  print(err, file=sys.stderr)
              sys.exit(1)
          print(f"OK: audited {len(tracked)} tracked files (0 hygiene violations).")
          PY

  offline-tests:
    name: Offline Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create venv and install dev dependencies
        run: |
          uv venv --clear .venv --python ${{ matrix.python-version }}
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Cache pinned offline assets
        uses: actions/cache@v5
        with:
          path: local_assets
          key: local-assets-${{ hashFiles('src/pea/assets.py', 'scripts/fetch_assets.py') }}

      - name: Fetch and verify pinned offline assets
        run: |
          .venv/bin/python scripts/fetch_assets.py --fetch
          .venv/bin/python scripts/fetch_assets.py --check

      - name: Resolve Playwright version and browser cache path
        id: pw
        run: |
          PW_VER=$(.venv/bin/python -c "import importlib.metadata as m; print(m.version('playwright'))")
          echo "version=${PW_VER}" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/ms-playwright" >> "$GITHUB_ENV"

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: .venv/bin/playwright install chromium

      - name: Install Chromium Linux system dependencies
        if: runner.os == 'Linux'
        run: .venv/bin/playwright install-deps chromium

      - name: Run full offline test suite
        run: .venv/bin/pytest tests/ -m "not live_sim" -v

  live-html5-e2e:
    name: Live HTML5 RC/RLC E2E (ubuntu-latest, Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Create venv and install dev dependencies
        run: |
          uv venv --clear .venv --python 3.13
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Cache pinned offline assets
        uses: actions/cache@v5
        with:
          path: local_assets
          key: local-assets-${{ hashFiles('src/pea/assets.py', 'scripts/fetch_assets.py') }}

      - name: Fetch and verify pinned offline assets
        run: |
          .venv/bin/python scripts/fetch_assets.py --fetch
          .venv/bin/python scripts/fetch_assets.py --check

      - name: Resolve Playwright version and browser cache path
        id: pw
        run: |
          PW_VER=$(.venv/bin/python -c "import importlib.metadata as m; print(m.version('playwright'))")
          echo "version=${PW_VER}" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BROWSERS_PATH=${RUNNER_TEMP}/ms-playwright" >> "$GITHUB_ENV"

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: .venv/bin/playwright install chromium

      - name: Install Chromium Linux system dependencies
        run: .venv/bin/playwright install-deps chromium

      - name: Run live HTML5 RC/RLC transient E2E benchmark
        run: .venv/bin/pytest tests/e2e/test_transient_m2_e2e.py -m live_sim -v
